<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Personal Assistant</title>
    <link rel="stylesheet" href="{{ url_for('static',filename='style.css')}}">
</head>

<body>
    <h1 class="main-heading">AI Personal Assistant</h1>
    <div class="container">
        <h2>Ask Anything</h2>
        <form id="askForm">
            <input type="text" name="question" placeholder="Ask Anything.." required>
            <button type="submit">Ask</button>
        </form>
        <p id="ans-loading" style="display: none;">Processing..</p>
        <p id="answer"></p>
        <hr>

        <h2>Summarize Email</h2>
        <form id="emailForm">
            <textarea type="text" name="email" placeholder="Paste Your Email here.." required></textarea>
            <button type="submit">Summarize</button>
        </form>
        <p id="summary-loading" style="display:none;">Processing..</p>
        <p id="summary"></p>
    </div>
    
<script>
    // Ask Anything
    document.getElementById("askForm").addEventListener(
        "submit",
        async function (e) {
            e.preventDefault();

            const form = e.target;
            const loading = document.getElementById("ans-loading");
            const answer = document.getElementById("answer");
            const button = form.querySelector('button[type="submit"]');

            loading.style.display = "block";
            answer.innerText = "";
            button.disabled = true;

            try {
                const res = await fetch("/ask", {
                    method: "POST",
                    body: new FormData(form)
                });

                const data = await res.json();

                if (!res.ok) {
                    throw new Error(data.error || "AI request failed.");
                }

                answer.innerText = data.response || "No answer received.";

            } catch (error) {
                console.error("Ask error:", error);
                answer.innerText = "Error: " + error.message;

            } finally {
                loading.style.display = "none";
                button.disabled = false;
            }
        }
    );


    // Summarize Email
    document.getElementById("emailForm").addEventListener(
        "submit",
        async function (e) {
            e.preventDefault();

            const form = e.target;
            const loading = document.getElementById("summary-loading");
            const summary = document.getElementById("summary");
            const button = form.querySelector('button[type="submit"]');

            loading.style.display = "block";
            summary.innerText = "";
            button.disabled = true;

            try {
                const res = await fetch("/summarize", {
                    method: "POST",
                    body: new FormData(form)
                });

                const data = await res.json();

                if (!res.ok) {
                    throw new Error(
                        data.error || "Summarization failed."
                    );
                }

                summary.innerText =
                    data.response || "No summary received.";

            } catch (error) {
                console.error("Summarize error:", error);
                summary.innerText = "Error: " + error.message;

            } finally {
                loading.style.display = "none";
                button.disabled = false;
            }
        }
    );
</script>

</body>

</html>
